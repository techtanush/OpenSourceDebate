# Policy debate (two-person teams). Times are common defaults; check your league's rules.
name: policy
wpm_default: 300
cross_ex: true
speeches:
  - {id: 1AC, side: aff, role: constructive, minutes: 8}
  - {id: CX-1NC, role: cross-ex, minutes: 3, asker: neg}
  - {id: 1NC, side: neg, role: constructive, minutes: 8}
  - {id: CX-2AC, role: cross-ex, minutes: 3, asker: aff}
  - {id: 2AC, side: aff, role: rebuttal-1, minutes: 8}
  - {id: CX-2NC, role: cross-ex, minutes: 3, asker: neg}
  - {id: 2NC, side: neg, role: rebuttal-1, minutes: 8}
  - {id: CX-1NR, role: cross-ex, minutes: 3, asker: aff}
  - {id: 1NR, side: neg, role: rebuttal-2, minutes: 5}
  - {id: 1AR, side: aff, role: rebuttal-2, minutes: 5}
  - {id: 2NR, side: neg, role: summary, minutes: 5}
  - {id: 2AR, side: aff, role: summary, minutes: 5}
prep_minutes_per_side: 8
evidence_expected: true
new_arguments_allowed_in: [constructive, rebuttal-1]
notes: >
  Policy rounds are evidence-heavy and fast. Use frontlines/blocks files heavily
  and keep read text within minutes x wpm.
